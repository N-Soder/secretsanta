# Secrets are provisioned independently per Worker: RESEND_API_KEY and LINK_KEY.
# LINK_KEY must match the corresponding Pages environment; never regenerate it.
name = "secretsanta-sweeper"
main = "index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["0 * * * *"]

[vars]
EMAIL_FROM = "Secret Santa <santa@updates.soderholm.app>"

[[d1_databases]]
binding = "DB"
database_name = "secretsanta"
database_id = "374718d9-3bee-4174-97b0-8bab618b2a02"
migrations_dir = "../../migrations"

[env.preview]
name = "secretsanta-sweeper-preview"
workers_dev = false
preview_urls = false

[env.preview.triggers]
crons = ["0 * * * *"]

[env.preview.vars]
EMAIL_FROM = "Secret Santa <santa@updates.soderholm.app>"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "secretsanta-preview"
database_id = "3da45c42-7199-476b-8f44-e37402049341"
migrations_dir = "../../migrations"
